<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Tech Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Student Tech Hub</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#events">Events</a></li>
            <li><a href="#register">Register</a></li>
        </ul>
    </nav>

    <header id="home" class="hero">
        <h1>Welcome to Student Tech Hub</h1>
        <p>Your gateway to the latest technical events, workshops, and student communities.</p>
        <a href="#events" class="btn">Explore Events</a>
    </header>

    <section id="events" class="section">
        <h2>Upcoming Events</h2>
        <button id="load-events-btn" class="btn btn-secondary">Load Events</button>
        <div id="events-container" class="events-grid">
            <!-- Events will be loaded here dynamically -->
        </div>
        <p id="events-error" class="error-message"></p>
    </section>

    <section id="register" class="section bg-light">
        <h2>Join the Hub</h2>
        <form id="registration-form" class="form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <p id="registration-message"></p>
    </section>

    <footer>
        <p>&copy; 2026 Student Tech Hub</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
